<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Údržba – Anna Juranová</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <style>
    :root {
      --c-primary: #a61f4d;
      --c-primary-2: #a5224d;
      --c-gold: #d4af37;
      --c-bg: #ffffff;
      --c-text: #1a1a1a;
      --c-muted: #6b6b6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--c-bg);
      color: var(--c-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 24px;
      text-align: center;
    }

    /* Jemné akvarelové skvrny na pozadí – čisté CSS, žádné obrázky */
    .blob {
      position: fixed;
      border-radius: 42% 58% 60% 40% / 50% 44% 56% 50%;
      filter: blur(2px);
      pointer-events: none;
      z-index: 0;
    }

    .blob--1 {
      width: 480px;
      height: 420px;
      top: -10%;
      left: -12%;
      background: radial-gradient(ellipse at center, rgba(166, 31, 77, 0.16) 0%, rgba(166, 31, 77, 0.08) 45%, transparent 70%);
    }

    .blob--2 {
      width: 520px;
      height: 460px;
      bottom: -14%;
      right: -10%;
      background: radial-gradient(ellipse at center, rgba(212, 175, 55, 0.18) 0%, rgba(212, 175, 55, 0.09) 45%, transparent 70%);
    }

    .blob--3 {
      width: 360px;
      height: 320px;
      top: 45%;
      right: 15%;
      background: radial-gradient(ellipse at center, rgba(166, 31, 77, 0.1) 0%, transparent 70%);
    }

    .card {
      position: relative;
      z-index: 1;
      max-width: 520px;
    }

    .logo {
      font-family: 'Brush Script MT', 'Segoe Script', cursive;
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 700;
      color: var(--c-primary);
      display: inline-block;
      padding-bottom: 6px;
      position: relative;
      margin-bottom: 32px;
    }

    .logo::after {
      content: '';
      position: absolute;
      left: 4%;
      right: 6%;
      bottom: 0;
      height: 3px;
      background: linear-gradient(135deg, var(--c-gold) 0%, #b89520 100%);
      border-radius: 999px;
      transform: rotate(-1.5deg);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--c-primary);
      padding: 0.55rem 1.3rem;
      border: 2px solid var(--c-primary);
      border-radius: 999px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(1.4rem, 4vw, 1.85rem);
      font-weight: 800;
      line-height: 1.4;
      color: var(--c-text);
      margin-bottom: 14px;
    }

    p {
      font-size: clamp(1rem, 2.4vw, 1.1rem);
      line-height: 1.7;
      color: var(--c-muted);
    }

    @media (prefers-reduced-motion: no-preference) {
      .blob {
        animation: drift 24s ease-in-out infinite alternate;
      }

      .blob--2 {
        animation-duration: 28s;
      }

      .blob--3 {
        animation-duration: 20s;
      }
    }

    @keyframes drift {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(16px, -14px) scale(1.04);
      }
    }
  </style>
</head>

<body>

  <div class="blob blob--1" aria-hidden="true"></div>
  <div class="blob blob--2" aria-hidden="true"></div>
  <div class="blob blob--3" aria-hidden="true"></div>

  <main class="card">
    <span class="logo">Anna Juranová</span>

    <h1>Své služby mám momentálně pozastavené.</h1>
    <p>Děkuji za pochopení.</p>
  </main>

</body>

</html>
